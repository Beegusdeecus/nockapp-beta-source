[package]
name = "nockapp-zkid-count-v2"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
# Separate v2 raw-count candidate; preserves existing v1 executable/state.
# Exact source archive and revision are recorded in domain-source.lock.json.
credx = { path = "../local/credx-source-691297a7f9ffcc1f51a5d30741086402d64544c9" }
rand = "=0.8.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"

nockapp-authorship-v4 = { path = "../authorship-crypto", optional = true, default-features = false }

[profile.dev]
debug = 0
incremental = false

[features]
private-authorship-v4 = ["dep:nockapp-authorship-v4"]
